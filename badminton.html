<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2057a5">
  <title>羽球報名</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>羽球報名</h1>
    <p>共 <span id="courtsText">2</span> 場、每場 <span id="perCourtText">8</span> 人，前 <span id="capacityText">16</span> 位正取，之後依序候補。</p>
  </header>

  <main>
    <section class="card summary" aria-label="報名人數">
      <div class="stat">
        <span class="stat-label">正取</span>
        <span class="stat-value"><span id="confirmedCount">–</span> / <span id="capacityStat">16</span></span>
      </div>
      <div class="stat">
        <span class="stat-label">候補</span>
        <span class="stat-value" id="waitlistCount">–</span>
      </div>
      <div class="stat">
        <span class="stat-label">總人數</span>
        <span class="stat-value" id="totalCount">–</span>
      </div>
      <div class="stat">
        <span class="stat-label">已繳費</span>
        <span class="stat-value" id="paidCount">–</span>
      </div>
    </section>

    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">我要報名</h2>
      <form id="signupForm" novalidate>
        <div class="field">
          <label for="name">名字</label>
          <input id="name" name="name" type="text" maxlength="30" autocomplete="name" required placeholder="例如：小明">
        </div>

        <div class="field">
          <label for="level_note">程度備註 <span class="optional">（選填）</span></label>
          <input id="level_note" name="level_note" type="text" maxlength="100" placeholder="例如：初學、會打雙打、中階">
        </div>

        <fieldset class="field">
          <legend>繳費狀態</legend>
          <div class="segmented two">
            <input type="radio" id="pay-no" name="pay" value="未繳費" checked>
            <label for="pay-no">未繳費</label>
            <input type="radio" id="pay-yes" name="pay" value="已繳費">
            <label for="pay-yes">已繳費</label>
          </div>
        </fieldset>

        <button type="submit" id="submitBtn">送出報名</button>
        <p id="formMessage" class="message" role="status" aria-live="polite"></p>
      </form>
      <p class="note">繳費後可以在下方名單點選「未繳費」改成「已繳費」；要取消報名，按名單上的「刪除」。</p>
    </section>

    <section class="card" aria-labelledby="confirmed-title">
      <div class="list-head">
        <h2 id="confirmed-title">報名成功（正取）</h2>
        <div class="list-actions">
          <button type="button" id="addBtn" class="secondary">＋ 新增人員</button>
          <button type="button" id="refreshBtn" class="secondary">重新整理</button>
        </div>
      </div>
      <p id="listMessage" class="message" role="status" aria-live="polite"></p>
      <ol id="confirmedList" class="player-list"></ol>
    </section>

    <section class="card" aria-labelledby="waitlist-title">
      <h2 id="waitlist-title">候補名單</h2>
      <p id="waitlistEmpty" class="message info">目前沒有候補。</p>
      <ol id="waitlist" class="player-list"></ol>
    </section>
  </main>

  <footer class="site-footer"><a href="index.html">前往報修登記</a></footer>

  <!-- supabase-js v2（固定版本，由 CDN 載入） -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="badminton.js"></script>
</body>
</html>
