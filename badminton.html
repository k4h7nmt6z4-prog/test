<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2057a5">
  <meta name="description" content="羽球報名：正取／候補名單、繳費狀態與程度備註">
  <title>羽球報名</title>
  <!-- PWA：加到主畫面後像 App 一樣開啟 -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="羽球報名">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>羽球報名</h1>
    <p>共 <span id="courtsText">4</span> 場、每場 <span id="perCourtText">8</span> 人，前 <span id="capacityText">32</span> 位正取，之後依序候補。</p>
  </header>

  <main>
    <p id="offlineBar" class="offline-bar" role="status" hidden>目前沒有網路連線，名單可能不是最新的。</p>

    <section id="installCard" class="card install-card" hidden>
      <div class="install-text">
        <strong>把羽球報名加到主畫面</strong>
        <span id="installHint">像 App 一樣，一點就開。</span>
      </div>
      <div class="install-actions">
        <button type="button" id="installBtn">安裝</button>
        <button type="button" id="installClose" class="secondary" aria-label="不要再顯示">✕</button>
      </div>
    </section>

    <!-- 登入／註冊：每個帳號只看得到自己的名單 -->
    <section id="authCard" class="card" aria-labelledby="auth-title" hidden>
      <h2 id="auth-title">登入</h2>
      <p class="note auth-intro">每個人用自己的帳號登入，只會看到自己建立的名單。</p>
      <form id="authForm" novalidate>
        <div class="field">
          <label for="authEmail">Email</label>
          <input id="authEmail" type="email" autocomplete="username" inputmode="email" required>
        </div>
        <div class="field">
          <label for="authPassword">密碼 <span class="optional">（至少 6 個字元）</span></label>
          <input id="authPassword" type="password" autocomplete="current-password" minlength="6" required>
        </div>
        <button type="submit" id="authSubmit">登入</button>
        <p id="authMessage" class="message" role="status" aria-live="polite"></p>
      </form>
      <p class="auth-switch">
        <span id="authSwitchText">還沒有帳號？</span>
        <button type="button" id="authSwitch" class="link-btn">註冊新帳號</button>
      </p>
    </section>

    <p id="authLoading" class="message info">載入中…</p>

    <div id="appArea" hidden>
    <section class="card account-bar" aria-label="帳號">
      <span>已登入：<strong id="accountEmail"></strong></span>
      <button type="button" id="logoutBtn" class="secondary">登出</button>
    </section>

    <section class="card summary" aria-label="報名人數">
      <div class="stat">
        <span class="stat-label">正取</span>
        <span class="stat-value"><span id="confirmedCount">–</span> / <span id="capacityStat">32</span></span>
      </div>
      <div class="stat">
        <span class="stat-label">候補</span>
        <span class="stat-value" id="waitlistCount">–</span>
      </div>
      <div class="stat">
        <span class="stat-label">總人數</span>
        <span class="stat-value" id="totalCount">–</span>
      </div>
      <div class="stat">
        <span class="stat-label">已繳費</span>
        <span class="stat-value" id="paidCount">–</span>
      </div>
    </section>

    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">新增報名</h2>
      <form id="signupForm" novalidate>
        <div class="field">
          <label for="name">名字</label>
          <input id="name" name="name" type="text" maxlength="30" autocomplete="name" required placeholder="例如：小明">
        </div>

        <div class="field">
          <label for="level">程度 <span class="optional">（1～10）</span></label>
          <select id="level" name="level" required>
            <option value="" selected disabled>請選擇</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
          </select>
        </div>

        <fieldset class="field">
          <legend>繳費狀態</legend>
          <div class="segmented two">
            <input type="radio" id="pay-no" name="pay" value="未繳費" checked>
            <label for="pay-no">未繳費</label>
            <input type="radio" id="pay-yes" name="pay" value="已繳費">
            <label for="pay-yes">已繳費</label>
          </div>
        </fieldset>

        <button type="submit" id="submitBtn">送出報名</button>
        <p id="formMessage" class="message" role="status" aria-live="polite"></p>
      </form>
      <p class="note">這份名單只有你的帳號看得到。點名單上的「未繳費／已繳費」可切換；按「刪除」可移除人員。</p>
    </section>

    <section class="card" aria-labelledby="confirmed-title">
      <div class="list-head">
        <h2 id="confirmed-title">報名成功（正取）</h2>
        <div class="list-actions">
          <button type="button" id="addBtn" class="secondary">＋ 新增人員</button>
          <button type="button" id="refreshBtn" class="secondary">重新整理</button>
        </div>
      </div>
      <p id="listMessage" class="message" role="status" aria-live="polite"></p>
      <ol id="confirmedList" class="player-list"></ol>
    </section>

    <section class="card" aria-labelledby="waitlist-title">
      <h2 id="waitlist-title">候補名單</h2>
      <p id="waitlistEmpty" class="message info">目前沒有候補。</p>
      <ol id="waitlist" class="player-list"></ol>
    </section>
    </div>
  </main>

  <footer class="site-footer"><a href="index.html">前往報修登記</a></footer>

  <!-- supabase-js v2（固定版本，由 CDN 載入） -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="badminton.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
