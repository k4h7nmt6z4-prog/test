<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2057a5">
  <title>報修登記</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>報修登記</h1>
    <p>設備、網路、環境有問題，在這裡登記。示範系統，請使用虛構資料。</p>
  </header>

  <main>
    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">新增報修</h2>
      <form id="repairForm" novalidate>
        <div class="field">
          <label for="reporter_name">報修人</label>
          <input id="reporter_name" name="reporter_name" type="text" maxlength="50" autocomplete="name" required placeholder="例如：示範員工甲">
        </div>

        <div class="field">
          <label for="location">地點或部門</label>
          <input id="location" name="location" type="text" maxlength="100" required placeholder="例如：工地 A 區">
        </div>

        <div class="field">
          <label for="category">類別</label>
          <select id="category" name="category" required>
            <option value="" selected disabled>請選擇</option>
            <option value="設備">設備</option>
            <option value="網路">網路</option>
            <option value="環境">環境</option>
            <option value="其他">其他</option>
          </select>
        </div>

        <div class="field">
          <label for="description">問題說明</label>
          <textarea id="description" name="description" rows="4" maxlength="1000" required placeholder="請描述發生了什麼問題"></textarea>
          <small class="hint"><span id="descCount">0</span> / 1000 字</small>
        </div>

        <fieldset class="field">
          <legend>緊急程度</legend>
          <div class="segmented">
            <input type="radio" id="urg-low" name="urgency" value="低">
            <label for="urg-low">低</label>
            <input type="radio" id="urg-mid" name="urgency" value="中" checked>
            <label for="urg-mid">中</label>
            <input type="radio" id="urg-high" name="urgency" value="高">
            <label for="urg-high">高</label>
          </div>
        </fieldset>

        <button type="submit" id="submitBtn">送出報修</button>
        <p id="formMessage" class="message" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="card" aria-labelledby="list-title">
      <div class="list-head">
        <h2 id="list-title">最近 20 筆報修</h2>
        <button type="button" id="refreshBtn" class="secondary">重新整理</button>
      </div>
      <p id="listMessage" class="message" role="status" aria-live="polite"></p>
      <ul id="requestList" class="request-list"></ul>
    </section>
  </main>

  <footer class="site-footer">報修登記示範 · 資料皆為虛構 · <a href="badminton.html">前往羽球報名</a></footer>

  <!-- supabase-js v2（固定版本，由 CDN 載入） -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
